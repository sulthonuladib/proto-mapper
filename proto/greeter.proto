syntax = "proto3";

package acme.greeter.v1;

import "common.proto";

// A request to be greeted.
message HelloRequest {
  // Who to greet.
  string name = 1;

  // Labels passed through to the reply.
  map<string, string> labels = 2;

  repeated string tags = 3;

  // BCP 47 language tag; absent means English.
  optional string locale = 4;

  // Exactly one of these is set.
  oneof contact {
    string email = 5;
    string phone = 6;
  }

  // Seconds since the epoch.
  int64 sent_at_unix = 7;

  acme.common.v1.UserId from = 8;

  acme.common.v1.ContactPreference preferred_contact = 9;

  bytes signature = 10;
}

// The greeting.
message HelloReply {
  string message = 1;
  int64 server_time = 2;
}

// Greets people.
service Greeter {
  // Say hello once.
  rpc SayHello(HelloRequest) returns (HelloReply);

  // Say hello several times.
  rpc SayHelloStream(HelloRequest) returns (stream HelloReply);
}
